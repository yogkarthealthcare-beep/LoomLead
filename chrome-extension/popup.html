<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LoomLead Capturer</title>
  <style>
    :root {
      --primary: #f97316;
      --primary-hover: #ea580c;
      --bg-dark: #0f172a;
      --text-dark: #1e293b;
      --border: #e2e8f0;
      --light-bg: #f8fafc;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    body { width: 380px; background: #ffffff; color: var(--text-dark); font-size: 13px; line-height: 1.4; }
    
    /* Header */
    .header {
      background: var(--bg-dark);
      color: #fff;
      padding: 10px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 2px solid var(--primary);
    }
    .logo-area { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 15px; }
    .logo-badge { background: var(--primary); color: #fff; font-size: 10px; padding: 2px 6px; border-radius: 4px; font-weight: 600; text-transform: uppercase; }
    .status-badge { font-size: 11px; padding: 2px 8px; border-radius: 12px; font-weight: 500; }
    .status-badge.connected { background: #dcfce7; color: #166534; }
    .status-badge.disconnected { background: #fee2e2; color: #991b1b; }
    
    /* Main Content */
    .content { padding: 12px 14px; }
    
    /* Settings panel */
    .settings-panel {
      background: var(--light-bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 10px;
      margin-bottom: 12px;
      display: none;
    }
    .settings-panel.active { display: block; }
    
    .form-group { margin-bottom: 10px; }
    .form-group label { display: block; font-size: 11px; font-weight: 600; color: #64748b; margin-bottom: 3px; }
    .form-control {
      width: 100%;
      padding: 6px 10px;
      border: 1px solid var(--border);
      border-radius: 5px;
      font-size: 12px;
      color: var(--text-dark);
      background: #fff;
    }
    .form-control:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 2px rgba(249, 115, 22, 0.2); }
    
    .row-2 { display: flex; gap: 8px; }
    .row-2 .form-group { flex: 1; }
    
    /* Source pill */
    .source-pill {
      background: #eff6ff;
      border: 1px solid #bfdbfe;
      color: #1e40af;
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 11px;
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    
    /* Buttons */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 7px 12px;
      font-size: 12px;
      font-weight: 600;
      border-radius: 5px;
      cursor: pointer;
      border: none;
      transition: all 0.15s ease;
      width: 100%;
    }
    .btn-primary { background: var(--primary); color: #fff; }
    .btn-primary:hover { background: var(--primary-hover); }
    .btn-secondary { background: #e2e8f0; color: #334155; }
    .btn-secondary:hover { background: #cbd5e1; }
    .btn-sm { padding: 4px 8px; font-size: 11px; width: auto; }
    
    /* Toast / Result card */
    .result-card {
      margin-top: 10px;
      padding: 10px;
      border-radius: 6px;
      display: none;
      font-size: 12px;
    }
    .result-card.success {
      background: #f0fdf4;
      border: 1px solid #bbf7d0;
      color: #166534;
    }
    .result-card.error {
      background: #fef2f2;
      border: 1px solid #fecaca;
      color: #991b1b;
    }
    .score-tag {
      display: inline-block;
      padding: 2px 6px;
      border-radius: 4px;
      font-weight: 600;
      font-size: 11px;
      margin-left: 4px;
    }
    .score-hot { background: #fee2e2; color: #dc2626; }
    .score-warm { background: #fef3c7; color: #d97706; }
    .score-cold { background: #f1f5f9; color: #475569; }
    
    .spinner {
      display: inline-block;
      width: 12px;
      height: 12px;
      border: 2px solid rgba(255,255,255,0.3);
      border-radius: 50%;
      border-top-color: #fff;
      animation: spin 0.8s linear infinite;
      margin-right: 6px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <!-- Header -->
  <div class="header">
    <div class="logo-area">
      <span>loom<span style="color: var(--primary);">Lead</span></span>
      <span class="logo-badge">Capturer</span>
    </div>
    <div style="display: flex; align-items: center; gap: 6px;">
      <span id="connectionBadge" class="status-badge disconnected">Disconnected</span>
      <button id="toggleSettingsBtn" class="btn btn-secondary btn-sm" title="Configure API Key">⚙️</button>
    </div>
  </div>

  <div class="content">
    <!-- Settings Panel (API Key Configuration) -->
    <div id="settingsPanel" class="settings-panel">
      <div style="font-weight: 700; margin-bottom: 6px; font-size: 12px;">🔑 API Key Connection</div>
      <div class="form-group">
        <label>LoomLead API Base URL</label>
        <input type="text" id="apiUrlInput" class="form-control" value="https://api.yogkart.com/loomlead/api/v1/public" placeholder="https://api.domain.com/loomlead/api/v1/public">
      </div>
      <div class="form-group">
        <label>Tenant API Key (ll_live_...)</label>
        <input type="password" id="apiKeyInput" class="form-control" placeholder="ll_live_xxxxxxxxxxxxxxxxxxxxxxxx">
      </div>
      <button id="saveSettingsBtn" class="btn btn-primary btn-sm">Save Connection</button>
    </div>

    <!-- Active Page Detection Pill -->
    <div class="source-pill">
      <div>
        <strong>Viewing:</strong> <span id="sourceDomain">Scanning page...</span>
      </div>
      <button id="rescanBtn" class="btn btn-secondary btn-sm" style="font-size: 10px; padding: 2px 6px;">↻ Rescan</button>
    </div>

    <!-- Lead Data Form -->
    <form id="leadForm">
      <div class="form-group">
        <label>Prospect / Contact Name *</label>
        <input type="text" id="leadName" class="form-control" required placeholder="Full Name or Business Name">
      </div>

      <div class="row-2">
        <div class="form-group">
          <label>Company Name</label>
          <input type="text" id="companyName" class="form-control" placeholder="Company Name">
        </div>
        <div class="form-group">
          <label>Industry / Category</label>
          <input type="text" id="leadCategory" class="form-control" placeholder="e.g. IT, Real Estate">
        </div>
      </div>

      <div class="row-2">
        <div class="form-group">
          <label>Phone Number *</label>
          <input type="text" id="leadPhone" class="form-control" placeholder="+91 98765 43210">
        </div>
        <div class="form-group">
          <label>Email Address</label>
          <input type="email" id="leadEmail" class="form-control" placeholder="contact@domain.com">
        </div>
      </div>

      <div class="form-group">
        <label>Website URL</label>
        <input type="text" id="leadWebsite" class="form-control" placeholder="https://company.com">
      </div>

      <div class="row-2">
        <div class="form-group">
          <label>Initial Pipeline Stage</label>
          <select id="leadStage" class="form-control">
            <option value="New">New</option>
            <option value="Contacted">Contacted</option>
            <option value="Qualified">Qualified</option>
          </select>
        </div>
        <div class="form-group">
          <label>Estimated Value (₹)</label>
          <input type="number" id="budgetValue" class="form-control" value="0">
        </div>
      </div>

      <div class="form-group">
        <label>Discussion / Context Notes</label>
        <textarea id="leadNotes" class="form-control" rows="2" placeholder="Captured from active browser tab..."></textarea>
      </div>

      <button type="submit" id="submitBtn" class="btn btn-primary" style="margin-top: 4px;">
        <span id="btnSpinner" class="spinner" style="display: none;"></span>
        <span id="btnText">Save to LoomLead CRM</span>
      </button>
    </form>

    <!-- Success / Error Result Alert -->
    <div id="resultCard" class="result-card">
      <div id="resultMessage" style="font-weight: 600; margin-bottom: 4px;"></div>
      <div id="resultDetails" style="font-size: 11px; opacity: 0.9;"></div>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
